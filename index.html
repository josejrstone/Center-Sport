<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Center Sport</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="loading">Carregando...</div>
    <div id="app" style="display:none;">
        <h1 id="store-name"></h1>
        <div id="social-container"></div>
    </div>

    <script>
        const supabase = supabase.createClient('https://yklanebzjhweviqwfbbp.supabase.co', 'SUA_CHAVE_AQUI');

        async function init() {
            try {
                const { data, error } = await supabase.from('linktree_settings').select('config').eq('id', 1).single();
                if (error) throw error;
                
                // Renderização básica garantida
                document.getElementById('store-name').innerText = data.config.store.name;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (e) {
                document.getElementById('loading').innerText = "Erro ao carregar. Verifique o console.";
                console.error(e);
            }
        }
        init();
    </script>
</body>
</html>
